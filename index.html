<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUP Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>BUP Match</h1>
    <p>Connecting BUP students with shared interests 💚</p>
  </header>
  
  <main>
    <section id="signup">
      <h2>Create Your Profile</h2>
      <form id="signupForm">
        <input type="text" placeholder="Full Name" required><br>
        <input type="email" placeholder="Email" required><br>
        <input type="text" placeholder="Department" required><br>
        <input type="text" placeholder="Interests" required><br>
        <textarea placeholder="About You" required></textarea><br>
        <button type="submit">Sign Up</button>
      </form>
    </section>

    <section id="matches">
      <h2>Top Matches</h2>
      <div id="matchesContainer">
        <!-- Matches will be inserted here by JavaScript -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 BUP Match. Built with 💚 by Akib Muqtadir</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
